name: Android library
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - run: ./scripts/verify.sh
      - run: ./scripts/check-artifact.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-library
          path: |
            terminal/build/outputs/aar/*.aar
            sample/build/outputs/apk/debug/*.apk
