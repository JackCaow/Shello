name: Shello CI
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ios:
    name: iOS build and tests
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'
      - name: Prepare iOS tools and Simulator
        id: simulator
        run: |
          brew install xcodegen tmux
          xcodebuild -version
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          phones = [d for runtime, rows in devices.items() if '.iOS-' in runtime for d in rows if d['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No installed iPhone Simulator runtime')
          device = phones[0]
          if device['state'] != 'Booted':
              subprocess.run(['xcrun', 'simctl', 'boot', device['udid']], check=True)
          subprocess.run(['xcrun', 'simctl', 'bootstatus', device['udid'], '-b'], check=True)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('udid=' + device['udid'] + '\n')
          PY
          printf 'xcode=%s\n' "$(xcodebuild -version | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: native-cache
        with:
          path: ios/Frameworks/ShelloNative.xcframework
          key: ios-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.simulator.outputs.xcode }}-${{ hashFiles('scripts/build-native-ios.sh', 'scripts/build-ssh-ios.sh', 'scripts/assemble-ios-frameworks.sh', 'public/native/**', 'public/patches/**') }}
      - name: Build iOS native libraries
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/shello-ios-verify"
          { scripts/build-native-ios.sh && scripts/build-ssh-ios.sh && scripts/assemble-ios-frameworks.sh; } 2>&1 | tee "$RUNNER_TEMP/shello-ios-verify/native.log"
      - uses: actions/cache/save@v4
        if: steps.native-cache.outputs.cache-hit != 'true'
        with:
          path: ios/Frameworks/ShelloNative.xcframework
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Verify iOS native libraries, localization, SSH, pairing and UI
        env:
          SHELLO_VERIFY_DIR: ${{ runner.temp }}/shello-ios-verify
          SHELLO_SKIP_IPAD: '1'
        run: scripts/verify-ios.sh '${{ steps.simulator.outputs.udid }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-verification
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/shello-ios-verify/*.log
            ${{ runner.temp }}/shello-ios-verify/*.xcresult
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - run: python3 scripts/generate-pair-script.py && git diff --exit-code -- companion/pair.sh
      - run: bash -n companion/pair.sh scripts/package-apk.sh
      - name: Validate Shello pairing skill
        run: |
          command -v tmux >/dev/null || brew install tmux
          bash -n skills/shello-pair/scripts/bootstrap.sh
          python3 -m unittest discover -s tests -p 'test_pair_skill.py' -v
      - run: ./scripts/verify.sh
      - run: ./scripts/check-artifact.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-library
          path: |
            android/terminal/build/outputs/aar/*.aar
            android/sample/build/outputs/apk/debug/*.apk
  windows-pairing:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Windows PowerShell 5.1 pairing lifecycle
        shell: powershell
        run: ./tests/test_pair_windows.ps1
      - name: Verify PowerShell 7 pairing lifecycle
        if: success() || failure()
        shell: pwsh
        run: ./tests/test_pair_windows.ps1
  pairing-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y tmux openssh-server python3-venv
      - name: Check generated launchers and real HTTPS forwarding
        run: |
          python3 scripts/generate-pair-script.py
          python3 scripts/generate-windows-pair.py
          git diff --exit-code -- companion/pair.sh companion/pair.ps1 skills/shello-pair/scripts/pair.ps1
          bash -n companion/windows/wsl-host.sh
          python3 -m unittest discover -s tests -p 'test_pair_*.py' -v
          python3 -m unittest discover -s tests -p 'test_release*.py' -v
          python3 -m unittest discover -s companion -p 'test_*.py' -v
      - name: Validate isolated WSL Linux SSH and tmux backend
        run: SHELLO_WSL_ROOT_TEST=1 python3 -m unittest discover -s tests -p 'test_wsl_host.py' -v
