name: Android library
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - run: ./scripts/verify.sh
      - run: ./scripts/check-artifact.sh
      - name: Android 8.1 interaction regression
        timeout-minutes: 10
        shell: bash
        run: |
          sdkmanager 'emulator' 'system-images;android-27;google_apis;arm64-v8a'
          echo no | avdmanager create avd -n Ghostty_API27_CI -k 'system-images;android-27;google_apis;arm64-v8a' -d pixel_2
          "$ANDROID_HOME/emulator/emulator" -avd Ghostty_API27_CI -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/api27-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          booted=false
          for attempt in $(seq 1 90); do
            if [[ $(adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r') == 1 ]]; then
              booted=true
              break
            fi
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              cat "$RUNNER_TEMP/api27-emulator.log"
              exit 1
            fi
            sleep 2
          done
          if [[ $booted != true ]]; then cat "$RUNNER_TEMP/api27-emulator.log"; exit 1; fi
          ANDROID_SERIAL=emulator-5554 ./gradlew --no-daemon :terminal:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api27-test-results
          path: |
            terminal/build/outputs/androidTest-results/
            ${{ runner.temp }}/api27-emulator.log
      - uses: actions/upload-artifact@v4
        with:
          name: android-library
          path: |
            terminal/build/outputs/aar/*.aar
            sample/build/outputs/apk/debug/*.apk
